<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hijama Nation Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    height: 100dvh;
    font-family: 'DM Sans', sans-serif;
    background: #eef4ee;
    overflow: hidden;
  }

  body { display: flex; flex-direction: column; }

  .shell {
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
  }

  @media (min-width: 600px) {
    body {
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 70% 50% at 20% 10%, rgba(26,74,48,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(45,110,71,0.1) 0%, transparent 55%),
        #eef4ee;
    }
    .shell {
      max-width: 460px;
      height: 92vh;
      max-height: 800px;
      min-height: 500px;
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(26,74,48,0.18), 0 2px 12px rgba(0,0,0,0.08);
    }
  }

  /* HEADER */
  .hdr {
    background: linear-gradient(135deg, #163d27 0%, #1a4a30 45%, #2d6e47 100%);
    padding: 14px 16px 13px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 11px;
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .hdr::before {
    content: ''; position: absolute; top: -35px; right: -35px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .av {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; position: relative; z-index: 1;
  }
  .av svg { width: 22px; height: 22px; }
  .online-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #5cdb95; border: 2px solid #1a4a30;
  }
  .hdr-info { flex: 1; position: relative; z-index: 1; min-width: 0; }
  .hdr-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 600; color: #fff;
    letter-spacing: 0.02em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hdr-sub {
    font-size: 10.5px; color: rgba(255,255,255,0.55);
    margin-top: 2px; font-weight: 300; letter-spacing: 0.03em;
  }
  .live-pill {
    background: rgba(92,219,149,0.15);
    border: 1px solid rgba(92,219,149,0.3);
    color: #5cdb95; font-size: 10px; padding: 3px 9px;
    border-radius: 20px; letter-spacing: 0.06em; font-weight: 500;
    position: relative; z-index: 1; white-space: nowrap; flex-shrink: 0;
  }

  /* TRUST BAR */
  .trust {
    background: #f7fbf7; border-bottom: 1px solid #e2ede6;
    padding: 6px 14px; display: flex; flex-shrink: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .trust::-webkit-scrollbar { display: none; }
  .trust-item {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: #2d6e47; font-weight: 500;
    white-space: nowrap; padding-right: 14px; flex-shrink: 0;
  }
  .trust-item span { color: #777; font-weight: 400; }

  /* BISMILLAH */
  .bism {
    text-align: center; padding: 7px 0 2px;
    font-size: 12px; color: #2d6e47;
    letter-spacing: 0.08em; opacity: 0.45;
    font-weight: 300; flex-shrink: 0;
  }

  /* MESSAGES */
  .msgs {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px 8px;
    display: flex; flex-direction: column; gap: 11px;
    overscroll-behavior: contain;
  }
  .msgs::-webkit-scrollbar { width: 3px; }
  .msgs::-webkit-scrollbar-thumb { background: rgba(26,74,48,0.12); border-radius: 2px; }

  /* Empty state */
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; opacity: 0.35; pointer-events: none; padding-bottom: 40px;
  }
  .empty svg { width: 44px; height: 44px; }
  .empty p { font-size: 13px; color: #2d6e47; text-align: center; line-height: 1.6; }

  .msg { display: flex; gap: 7px; animation: up 0.28s ease; }
  .msg.u { flex-direction: row-reverse; }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .mav {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 500; align-self: flex-end;
  }
  .mav.b { background: linear-gradient(135deg, #163d27, #2d6e47); color: #fff; font-family: 'Playfair Display', serif; font-size: 12px; }
  .mav.u { background: #e6f4ec; color: #2d6e47; font-size: 11px; }

  .bub {
    max-width: 80%; padding: 10px 13px; border-radius: 18px;
    font-size: 14px; line-height: 1.6; font-weight: 400; word-break: break-word;
  }
  .bub.b {
    background: #f4f9f5; border: 1px solid #d6eadc;
    color: #1c3828; border-bottom-left-radius: 4px;
  }
  .bub.u {
    background: linear-gradient(135deg, #1a4a30, #2d6e47);
    color: #fff; border-bottom-right-radius: 4px;
  }
  .bub strong { color: #1a4a30; font-weight: 600; }
  .bub.u strong { color: #a8e6c1; }

  /* TYPING */
  .tdots {
    display: flex; gap: 4px; align-items: center;
    padding: 11px 14px; background: #f4f9f5;
    border: 1px solid #d6eadc;
    border-radius: 18px; border-bottom-left-radius: 4px;
  }
  .d {
    width: 5px; height: 5px; background: #2d6e47;
    border-radius: 50%; opacity: 0.5; animation: bop 1.2s infinite;
  }
  .d:nth-child(2) { animation-delay: .2s; }
  .d:nth-child(3) { animation-delay: .4s; }
  @keyframes bop { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  /* INPUT */
  .inp-area {
    padding: 8px 12px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid #e2ede6;
    background: #f7fbf7; flex-shrink: 0;
  }
  .inp-row {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1.5px solid #cde0d4;
    border-radius: 50px; padding: 8px 8px 8px 16px;
    transition: border-color 0.2s;
  }
  .inp-row:focus-within {
    border-color: #2d6e47;
    box-shadow: 0 0 0 3px rgba(45,110,71,0.07);
  }
  .inp-row input {
    flex: 1; background: none; border: none; outline: none;
    color: #1c3828; font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 400; caret-color: #2d6e47; min-width: 0;
  }
  .inp-row input::placeholder { color: #abc8b5; }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #1a4a30, #2d6e47);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s, transform 0.12s; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .send-btn:active { opacity: 0.8; transform: scale(0.94); }
  .send-btn svg { width: 16px; height: 16px; }
  .inp-footer {
    text-align: center; margin-top: 5px;
    font-size: 10px; color: #bbb; letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <div class="hdr">
    <div class="av">
      <svg viewBox="0 0 28 28" fill="none">
        <path d="M14 5C10 5 7 8 7 11.5c0 2 1 3.8 2.5 5C6.5 18 4.5 21 4.5 24.5h19C23.5 21 21.5 18 18.5 16.5 20 14.8 21 13 21 11.5 21 8 18 5 14 5z" fill="rgba(255,255,255,0.2)"/>
        <circle cx="14" cy="11" r="3" fill="rgba(255,255,255,0.5)"/>
        <path d="M10 22c.8-2.5 2-4 4-4s3.2 1.5 4 4" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <div class="online-dot"></div>
    </div>
    <div class="hdr-info">
      <div class="hdr-name">Hijama Nation Academy</div>
      <div class="hdr-sub">Diploma Advisor · Responds instantly</div>
    </div>
    <div class="live-pill">● Online</div>
  </div>

  <!-- TRUST BAR -->
  <div class="trust">
    <div class="trust-item">🎓 <span>Level 5 Accredited</span></div>
    <div class="trust-item">🌍 <span>40+ Countries</span></div>
    <div class="trust-item">✅ <span>GRCCT Certified</span></div>
    <div class="trust-item">💰 <span>Installments Available</span></div>
  </div>

  <!-- BISMILLAH -->
  <div class="bism">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>

  <!-- MESSAGES -->
  <div class="msgs" id="msgs">
    <div class="empty" id="empty-state">
      <svg viewBox="0 0 44 44" fill="none">
        <circle cx="22" cy="22" r="20" stroke="#2d6e47" stroke-width="1.5" opacity="0.6"/>
        <path d="M22 10c-5 0-9 4-9 8.5 0 2.5 1.2 4.7 3 6.2C13 26.5 11 30 11 34h22c0-4-2-7.5-5-9.3 1.8-1.5 3-3.7 3-6.2C31 14 27 10 22 10z" fill="#2d6e47" opacity="0.15"/>
        <circle cx="22" cy="18" r="3.5" fill="#2d6e47" opacity="0.35"/>
      </svg>
      <p>As-salamu alaykum 🌿<br>Ask me anything about the Diploma</p>
    </div>
  </div>

  <!-- INPUT -->
  <div class="inp-area">
    <div class="inp-row">
      <input
        type="text"
        id="inp"
        placeholder="Type a message..."
        onkeydown="onKey(event)"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="sentences"
      />
      <button class="send-btn" onclick="send()" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="inp-footer">Hijama Nation Academy · AI Diploma Advisor</div>
  </div>

</div>

<script>
  /* ── CHANGE THIS TO YOUR N8N WEBHOOK URL ── */
  const WEBHOOK_URL = 'https://ai.botyama.com/webhook/hijama nation';

  function scrollB() {
    const el = document.getElementById('msgs');
    setTimeout(() => { el.scrollTop = el.scrollHeight; }, 30);
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function removeEmpty() {
    document.getElementById('empty-state')?.remove();
  }

  function appendUser(txt) {
    removeEmpty();
    const m = document.getElementById('msgs');
    const d = document.createElement('div');
    d.className = 'msg u';
    d.innerHTML = `<div class="mav u">👤</div><div class="bub u">${esc(txt)}</div>`;
    m.appendChild(d);
  }

  function appendTyping() {
    const m = document.getElementById('msgs');
    const id = 'ty' + Date.now();
    const d = document.createElement('div');
    d.id = id; d.className = 'msg';
    d.innerHTML = `<div class="mav b">H</div><div class="tdots"><div class="d"></div><div class="d"></div><div class="d"></div></div>`;
    m.appendChild(d);
    return id;
  }

  function appendBot(content) {
    const m = document.getElementById('msgs');
    const d = document.createElement('div');
    d.className = 'msg';
    d.innerHTML = `<div class="mav b">H</div><div class="bub b">${content}</div>`;
    m.appendChild(d);
    scrollB();
  }

  function onKey(e) { if (e.key === 'Enter') send(); }

  async function send() {
    const inp = document.getElementById('inp');
    const txt = inp.value.trim();
    if (!txt) return;
    inp.value = '';
    inp.focus();

    appendUser(txt);
    const tid = appendTyping();
    scrollB();

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: txt,
          source: 'hijama_chatbot',
          timestamp: new Date().toISOString()
        })
      });

      const data = await res.json();
      document.getElementById(tid)?.remove();

      const reply = data.reply || data.text || data.message || data.output
        || 'JazakAllah Khair! Give me a moment.';

      appendBot(reply);

    } catch (err) {
      document.getElementById(tid)?.remove();
      appendBot('Sorry, there was a connection issue. Please try again.');
    }
  }

  window.addEventListener('resize', scrollB);

  document.body.addEventListener('touchmove', (e) => {
    if (!e.target.closest('.msgs')) e.preventDefault();
  }, { passive: false });
</script>
</body>
</html>
